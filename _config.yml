title: Jemin Lee
tagline: Data Engineer # 홈 <title>: "Jemin Lee | Data Engineer"
description: >- # this means to ignore newlines until "baseurl:"
  대규모 로그와 트래픽을 처리하는 데이터 파이프라인과 분석 시스템을 설계·운영해 온
  데이터 엔지니어 포트폴리오입니다.
lang: ko-KR

url: "https://solarin4314.github.io" # the base hostname & protocol for your site, e.g. https://example.github.io
baseurl: "" # the subpath of your site, e.g. /blog

# Navigation
urls:
    - text: Home
      url: /
    - text: Experience
      url: /experience
    - text: Strengths
      url: /strengths
    - text: Contact
      url : /contact

# Author
author: Jemin Lee
github_username: solarin4314

# syntax highlighter
markdown: kramdown
highlighter: rouge
permalink: pretty

defaults:
  -
    scope:
      path: 'assets/**'
    values:
      sitemap: false

# Build settings
# - jekyll-seo-tag: <title>, description, Open Graph(링크 미리보기) 메타 태그 생성 ({% seo %})
# - jekyll-sitemap: sitemap.xml / robots.txt 생성
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  sass_dir: _sass
  style: compressed

# Exclude from processing.
# GitHub Pages(Jekyll 3.x)에서는 exclude를 지정하면 기본 목록을 덮어쓰므로 기본 항목도 함께 적어 둡니다.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - assets/bower_components/icono/README.md
  - assets/bower_components/nanobar/README.md


destination: ./build
